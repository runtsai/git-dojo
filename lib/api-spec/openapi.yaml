openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dojo
    description: Git Dojo lesson and repository state operations
  - name: progress
    description: Course progress persistence across both tracks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dojo/overview:
    get:
      operationId: getDojoOverview
      tags: [dojo]
      summary: Course overview
      description: High-level progress across all Git Dojo lessons
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DojoOverview"
  /dojo/lessons:
    get:
      operationId: listLessons
      tags: [dojo]
      summary: List lessons
      description: All Git Dojo lessons with playground status
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /dojo/lessons/{lessonId}/state:
    get:
      operationId: getRepoState
      tags: [dojo]
      summary: Repository state for a lesson playground
      description: Full git state of the lesson's practice repository
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoState"
        "404":
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dojo/lessons/{lessonId}/check:
    post:
      operationId: runLessonCheck
      tags: [dojo]
      summary: Run the lesson's check script
      description: Executes the lesson's check.sh grader and returns its output
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "404":
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dojo/lessons/{lessonId}/bot:
    post:
      operationId: runBotAction
      tags: [dojo]
      summary: Let time pass — the simulated teammate acts
      description: Runs the lesson's scripted teammate beat (bot.sh), which may push commits to the lesson's shared remote
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teammate action results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotActionResult"
        "404":
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get saved course progress
      description: All completed modules across both tracks
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
  /progress/complete:
    post:
      operationId: completeModule
      tags: [progress]
      summary: Record a module completion
      description: Marks a module as passed and persists it server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteModuleRequest"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DojoOverview:
      type: object
      properties:
        totalLessons:
          type: number
        startedLessons:
          type: number
        totalCommits:
          type: number
        dojoFound:
          type: boolean
          description: Whether the git-dojo folder exists at the expected location
      required: [totalLessons, startedLessons, totalCommits, dojoFound]
    Lesson:
      type: object
      properties:
        id:
          type: string
          description: Short lesson id such as lesson-01
        number:
          type: number
        title:
          type: string
        folderName:
          type: string
          description: Lesson folder name such as lesson-01-first-snapshot
        hasPlayground:
          type: boolean
          description: setup.sh has been run for this lesson
        initialized:
          type: boolean
          description: The playground contains a git repository
        commitCount:
          type: number
        hasBot:
          type: boolean
          description: The lesson has a scripted teammate (bot.sh) that can act when time passes
      required:
        [id, number, title, folderName, hasPlayground, initialized, commitCount, hasBot]
    RepoFile:
      type: object
      properties:
        path:
          type: string
        status:
          type: string
          enum:
            [staged, modified, staged_and_modified, untracked, deleted, conflicted]
      required: [path, status]
    RepoCommit:
      type: object
      properties:
        hash:
          type: string
        shortHash:
          type: string
        subject:
          type: string
        authorName:
          type: string
        date:
          type: string
          description: ISO 8601 author date
        refs:
          type: array
          items:
            type: string
          description: Branch or tag names pointing at this commit
        branch:
          type: ["string", "null"]
          description: Branch this commit was listed under, when walking per-branch history
      required: [hash, shortHash, subject, authorName, date, refs]
    RepoBranch:
      type: object
      properties:
        name:
          type: string
        isCurrent:
          type: boolean
        headHash:
          type: string
      required: [name, isCurrent, headHash]
    RepoState:
      type: object
      properties:
        lessonId:
          type: string
        hasPlayground:
          type: boolean
        initialized:
          type: boolean
        currentBranch:
          type: ["string", "null"]
        detachedHead:
          type: boolean
        mergeInProgress:
          type: boolean
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepoFile"
        commits:
          type: array
          items:
            $ref: "#/components/schemas/RepoCommit"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/RepoBranch"
        remotes:
          type: array
          items:
            type: string
        summary:
          type: string
          description: Plain-English explanation of the current repository state
        hasBot:
          type: boolean
          description: The lesson has a scripted teammate (bot.sh) that can act when time passes
      required:
        [
          lessonId,
          hasBot,
          hasPlayground,
          initialized,
          currentBranch,
          detachedHead,
          mergeInProgress,
          files,
          commits,
          branches,
          remotes,
          summary,
        ]
    ProgressEntry:
      type: object
      properties:
        moduleId:
          type: string
          description: Module id such as 1.1 (Track A) or lesson-01 (Track B)
        track:
          type: string
          enum: [visual, cli]
        completedAt:
          type: string
          description: ISO 8601 timestamp of when the module first passed
      required: [moduleId, track, completedAt]
    Progress:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ProgressEntry"
      required: [entries]
    CompleteModuleRequest:
      type: object
      properties:
        moduleId:
          type: string
        track:
          type: string
          enum: [visual, cli]
      required: [moduleId, track]
    BotActionResult:
      type: object
      properties:
        ran:
          type: boolean
          description: Whether the teammate script ran
        output:
          type: string
          description: What the teammate did, in plain English
      required: [ran, output]
    CheckResult:
      type: object
      properties:
        ran:
          type: boolean
        passed:
          type: ["boolean", "null"]
          description: True when every check passed, null when it could not be determined
        output:
          type: string
          description: Raw output of check.sh
      required: [ran, passed, output]
